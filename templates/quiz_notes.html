{% if item.knowledge_notes %}
<div class="quiz-notes" hidden>
  <p class="quiz-notes-label">人物・用語紹介 · Wikidataの短い説明</p>
  {% for note in item.knowledge_notes %}
  <details{% if loop.first %} open{% endif %}>
    <summary>{{ note.term }}とは？</summary>
    <p>{{ note.description }}</p>
    <a href="{{ note.url }}" target="_blank" rel="noopener noreferrer">出典：Wikidata「{{ note.label }}」↗</a>
    <small> · 取得 {{ note.fetched_day }}</small>
  </details>
  {% endfor %}
</div>
{% endif %}
