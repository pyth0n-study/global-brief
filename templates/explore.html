@media(max-width:650px){.hero{padding:90px 24px 25px;min-height:220px}.hero h2{font-size:clamp(30px,8.5vw,48px);line-height:1.4}.place{font-size:14px}.body{padding:0 24px max(12px,env(safe-area-inset-bottom))}.summary{font-size:15px;margin-bottom:24px}.tab{font-size:12px;padding:14px 3px}.tab span{display:inline;margin-right:5px;font-size:16px}.panel p{font-size:13px}.progress{margin-top:18px}.bottom{margin-top:0}}
@media(max-height:650px){.hero{padding-top:65px;padding-bottom:15px;min-height:160px}.hero h2{font-size:clamp(26px,4.5vw,46px)}.summary{font-size:13px;margin-bottom:12px}.tab{padding:10px 4px}.panel{max-height:22dvh}}

<div class="brand">Global Brief<span> /</span></div>
<nav class="rail" aria-label="ニュースを選択"></nav>
<main class="feed" aria-label="ニュース体験の試作"></main>
<script>
const stories=[
 {color:'#275c57',tag:'物流と暮らし',place:'アルナ海峡（架空）',title:'貨物船が<span class="key">迂回</span>。<br>輸送に遅れの可能性',summary:'航路の安全確認で遠回りに。<br>この道を通る輸入品は、到着が遅れる可能性。',panels:[['航路が変わる、その手前には','これまで：船は決まった航路で荷物を運んでいた。\nきっかけ：航路上で安全確認が必要になった。\n今回：一部の船が、距離の長い別の道を選んだ。'],['同じ海でも、立場はさまざま','沿岸の国は安全と港の運営、輸出する国は商品の出荷、輸入する国は安定した供給に関わる。\n国同士の関係だけでなく、船会社の判断も重なる話題だよ。'],['「船の道」から「いつもの買い物」へ','日本に届く輸入品も、その航路を利用していれば関係する可能性がある。\nただし、すべての商品が値上がりするとは限らない。航路・在庫・迂回の長さで変わるよ。']],flow:['航路の迂回','輸送の時間・費用','商品の供給'],prompt:'どこが気になった？'},
 {color:'#354d75',tag:'資源とテクノロジー',place:'リオナ国（架空）',title:'スマホ部品の資源、<br><span class="key">輸出ルール見直し案</span>',summary:'電子機器に使う資源が対象。<br>調達や製品への影響は、まだ決まっていない。',panels:[['便利な製品を支える、長いつながり','これまで：資源の採掘、加工、部品づくりを複数の国で分担してきた。\nきっかけ：資源の安定確保が議論になった。\n今回：輸出の手続きを見直す案が提示された。'],['協力と競争は、同時にある','資源を持つ国、加工する国、製品を作る国は互いに取引している。\n貿易で協力していても、資源の管理方法では意見が異なることがある。単純な「仲がいい・悪い」では捉えきれないんだ。'],['身近な製品まで、何段階？','日本の企業がその資源を使っていれば、調達計画に関わる可能性がある。\nスマホの値段や発売日に影響するかは、代替材料や在庫次第。この案だけで値上がりは判断できないよ。']],flow:['資源','部品の調達','製品づくり'],prompt:'気になるつながりを開こう'},
 {color:'#895636',tag:'環境と食',place:'セリナ地方（架空）',title:'天候の変化で、<br>作物の<span class="key">収穫見通し下がる</span>',summary:'輸出側と買い付け側が対応を検討。<br>店頭価格への影響は、在庫や為替にもよる。',panels:[['今回だけで終わらない、作物の時間','これまで：作付けと収穫の計画に沿って取引していた。\nきっかけ：生産地域の天候が変わった。\n今回：収穫見通しを見直し、供給計画の調整が始まった。'],['輸出国と輸入国、必要なものの違い','輸出する国には自国の食料を確保する事情があり、輸入する国には安定して買い付けたい事情がある。\n他の産地との取引や、企業間の契約も供給を左右する。'],['食費とのつながりを、たどってみる','日本がその作物をその地域から輸入していれば、調達先や費用に関わり得る。\nただし、お店の価格には為替・契約・在庫なども関係する。収穫減から即値上げ、と決まるわけではないよ。']],flow:['産地の収穫','輸入・仕入れ','食卓'],prompt:'ニュースの先を、ひとつ知る'}
];
const shortPanels=[
 ['いつもの航路 → 安全確認 → 遠回りに。\nその分、輸送に時間がかかる可能性。','沿岸国は安全を確保したい。輸出入する国は荷物を安定して運びたい。\n船会社の判断も関わる。','この航路を使う輸入品なら、到着や輸送費に関わる可能性。\n値上がりするかは、在庫や迂回の長さ次第。'],
 ['国をまたいで、採掘 → 加工 → 部品づくり。\nその途中の輸出手続きが、見直しの対象に。','資源を売る国と、部品を作る国は互いに取引。\n貿易では協力しても、資源の管理では意見が分かれる。','日本企業が使う資源なら、調達計画に関わる可能性。\nスマホが高くなるかは、在庫や代替材料次第。'],
 ['作付け → 天候の変化 → 収穫見通しを下方修正。\n供給計画の調整が始まった。','輸出国は自国の食料を確保したい。輸入国は安定して買いたい。\n他の産地との取引も関わる。','日本がこの産地から輸入していれば、仕入れに関わる可能性。\n食費への影響は、為替や在庫にもよる。']
];
stories.forEach((s,i)=>s.panels.forEach((p,j)=>p[1]=shortPanels[i][j]));
const feed=document.querySelector('.feed'),rail=document.querySelector('.rail');
stories.forEach((s,i)=>{
 const article=document.createElement('article');article.className='story';article.id='story-'+i;article.style.setProperty('--scene',s.color);
 article.innerHTML=`<div class="sheet"><header class="hero" style="--bg:${s.color}"><div class="meta"><span class="place">${s.place}</span></div><h2>${s.title}</h2></header><div class="body"><p class="summary">${s.summary}</p><div class="tabs" role="tablist" aria-label="解説の切り替え">${['背景','国の関係','日本との接点'].map((x,j)=>`<button type="button" class="tab" role="tab" id="tab-${i}-${j}" aria-controls="panel-${i}" aria-selected="false" data-index="${j}"><span aria-hidden="true">${['↶','◎','↗'][j]}</span>${x}</button>`).join('')}</div><section class="panel" id="panel-${i}" role="tabpanel" aria-label="選んだ解説" aria-live="polite"></section><div class="progress" aria-hidden="true"><i></i></div><div class="bottom"><span>架空のニュース</span><button class="next" type="button" aria-label="${i<2?'次のニュース':'最初のニュース'}">${i<2?'↓':'↑'}</button></div></div></div>`;
 const seen=new Set();const tabs=[...article.querySelectorAll('.tab')];
 function select(j){seen.add(j);tabs.forEach((b,k)=>{b.setAttribute('aria-selected',String(k===j));if(seen.has(k))b.classList.add('seen')});const p=article.querySelector('.panel');p.classList.add('open');p.setAttribute('aria-labelledby',tabs[j].id);p.replaceChildren();let text=document.createElement('p');text.textContent=s.panels[j][1];p.append(text);if(j===2){const f=document.createElement('div');f.className='flow';s.flow.forEach((v,k)=>{if(k){let arrow=document.createElement('b');arrow.textContent='→';f.append(arrow)}let vspan=document.createElement('span');vspan.textContent=v;f.append(vspan)});p.append(f)}article.querySelector('.progress i').style.width=seen.size/3*100+'%'}
 tabs.forEach((b,j)=>{b.onclick=()=>select(j);b.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();let n=e.key==='Home'?0:e.key==='End'?2:(j+(e.key==='ArrowRight'?1:2))%3;tabs[n].focus();select(n)}}});
 article.querySelector('.next').onclick=()=>document.getElementById('story-'+((i+1)%3)).scrollIntoView({block:'start'});feed.append(article);
 const dot=document.createElement('button');dot.className='dot'+(i===0?' active':'');dot.setAttribute('aria-label',`ニュース${i+1}へ`);dot.onclick=()=>article.scrollIntoView({block:'start'});rail.append(dot);
});
const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){const n=[...feed.children].indexOf(e.target);[...rail.children].forEach((d,i)=>{d.classList.toggle('active',i===n);d.setAttribute('aria-current',String(i===n))})}}),{root:feed,threshold:.6});
[...feed.children].forEach(el=>observer.observe(el));

// Consume a wheel gesture once; avoid skipping multiple stories on a trackpad.
let wheelTotal=0,wheelLast=0,navUntil=0;
function currentStory(){return Math.round(feed.scrollTop/feed.clientHeight)}
function moveStory(direction){
 const next=Math.max(0,Math.min(stories.length-1,currentStory()+direction));
 feed.scrollTo({top:next*feed.clientHeight,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
 navUntil=performance.now()+650;
}
function canReadInside(target,delta){
 const box=target.closest('.panel,.sheet');
 return box && box.scrollHeight>box.clientHeight+2 && (delta>0?box.scrollTop+box.clientHeight<box.scrollHeight-2:box.scrollTop>2);
}
feed.addEventListener('wheel',e=>{
 if(e.ctrlKey||Math.abs(e.deltaX)>Math.abs(e.deltaY)||!e.deltaY)return;
 if(canReadInside(e.target,e.deltaY))return;
 e.preventDefault();const now=performance.now();const gap=now-wheelLast;wheelLast=now;
 if(now<navUntil){wheelTotal=0;return}
 if(gap<180 && wheelTotal===Infinity)return;
 if(gap>=180||Math.sign(wheelTotal)!==Math.sign(e.deltaY))wheelTotal=0;
 wheelTotal+=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?feed.clientHeight:1);
 if(Math.abs(wheelTotal)>=40){moveStory(Math.sign(wheelTotal));wheelTotal=Infinity}
},{passive:false});
let touchStart=null;
feed.addEventListener('touchstart',e=>{if(e.touches.length===1){const t=e.touches[0];touchStart={x:t.clientX,y:t.clientY,target:e.target,inside:false}}else touchStart=null},{passive:true});
feed.addEventListener('touchmove',e=>{
 if(!touchStart||e.touches.length!==1)return;
 const dy=touchStart.y-e.touches[0].clientY;
 if(canReadInside(touchStart.target,dy)){touchStart.inside=true;return}
 if(!touchStart.inside && Math.abs(dy)>8)e.preventDefault();
},{passive:false});
feed.addEventListener('touchend',e=>{
 if(!touchStart)return;const t=e.changedTouches[0],dy=touchStart.y-t.clientY,dx=touchStart.x-t.clientX;
 if(!touchStart.inside&&Math.abs(dy)>45&&Math.abs(dy)>Math.abs(dx)&&performance.now()>navUntil)moveStory(Math.sign(dy));
 touchStart=null;
},{passive:true});
feed.addEventListener('touchcancel',()=>touchStart=null,{passive:true});
</script>
