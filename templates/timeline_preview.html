<template class="timeline-data">
<div class="timeline-view">
<div class="timeline-kicker">ブラジルの選挙制度の背景</div>
<div class="timeline-steps" role="group" aria-label="年表のコマを選ぶ"><button type="button" data-step="0">1985</button><span>—</span><button type="button" data-step="1">1988</button><span>—</span><button type="button" data-step="2">1989</button></div>
<div class="timeline-story" aria-live="polite"><div class="timeline-year"></div><h2></h2><p></p><a target="_blank" rel="noopener noreferrer">出典 ↗</a></div>
<div class="timeline-controls"><button type="button" class="timeline-prev">← 前へ</button><span class="timeline-page"></span><button type="button" class="timeline-next">次へ →</button></div>
<p class="timeline-context">大統領を国民が選ぶ制度にも、移行の歴史がある。</p>
</div>
</template>
<style>
.timeline-open>.inline-quiz{visibility:hidden}.timeline-open>.visual{opacity:.25}.timeline-open aside{max-height:57dvh;white-space:normal;width:min(100%,760px);padding:22px}.timeline-open aside>span{display:block}.timeline-kicker{font-size:11px;color:#b7cdbb;margin-bottom:12px}.timeline-steps{display:flex;gap:9px;align-items:center}.timeline-steps button{padding:8px 12px;min-height:44px;font-size:12px}.timeline-steps button[aria-current=true]{background:#d3edb8;color:#17382b;border-color:#d3edb8}.timeline-steps span{color:#69817b}.timeline-year{font-size:38px;line-height:1.2;color:#d3edb8;font-weight:850;margin-top:18px}.timeline-story h2{font-size:22px;line-height:1.5;margin:8px 0}.timeline-story p{font-size:14px;line-height:1.9;margin:0 0 14px}.timeline-story a{font-size:11px;color:#bacabf}.timeline-controls{display:flex;justify-content:space-between;align-items:center;margin-top:17px}.timeline-controls button{font-size:12px;padding:9px 14px;min-height:44px}.timeline-controls button:disabled{opacity:.3;cursor:default}.timeline-page{font-size:11px;color:#b7cdbb}.timeline-context{font-size:11px;line-height:1.7;color:#b7cdbb;border-top:1px solid #ffffff20;padding-top:12px;margin-bottom:0}@media(max-width:600px){.timeline-open aside{padding:16px;max-height:53dvh}.timeline-year{font-size:30px}.timeline-story h2{font-size:19px}.timeline-story p{font-size:13px}.timeline-steps{gap:5px}.timeline-steps button{padding:6px 10px}.timeline-open h1{font-size:22px;margin-bottom:14px}}
</style>
<script>
{
document.querySelectorAll('article').forEach(article=>{
 const data=article.querySelector('.article-timeline'),buttonCandidate=article.querySelector('[data-kind="background"]');
 if(!data||!buttonCandidate){if(buttonCandidate)buttonCandidate.hidden=true;return}
 const timeline=JSON.parse(data.textContent),moments=timeline.moments;
 const button=article.querySelector('[data-kind="background"]'),panel=article.querySelector('aside');button.textContent='これまで';let step=0;
 function show(){const m=moments[step],view=panel.querySelector('.timeline-view');view.querySelector('.timeline-kicker').textContent=timeline.label;view.querySelector('.timeline-context').textContent=timeline.context;view.querySelector('.timeline-year').textContent=m.year;view.querySelector('h2').textContent=m.title;view.querySelector('.timeline-story p').textContent=m.body;view.querySelector('.timeline-story a').href=m.source;view.querySelector('.timeline-story a').textContent='出典：'+m.publisher+' ↗';view.querySelector('.timeline-page').textContent=(step+1)+' / 3';view.querySelector('.timeline-prev').disabled=step===0;view.querySelector('.timeline-next').disabled=step===2;view.querySelectorAll('[data-step]').forEach((b,i)=>b.setAttribute('aria-current',String(i===step)))}
 button.addEventListener('click',()=>{if(panel.hidden){article.classList.remove('timeline-open');return}article.classList.add('timeline-open');const slot=panel.querySelector('span');slot.replaceChildren(document.querySelector('.timeline-data').content.cloneNode(true));slot.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=Number(b.dataset.step);show()});slot.querySelector('.timeline-prev').onclick=()=>{step=Math.max(0,step-1);show()};slot.querySelector('.timeline-next').onclick=()=>{step=Math.min(2,step+1);show()};slot.querySelectorAll('[data-step]').forEach((b,i)=>b.textContent=moments[i].year);show()});
 article.querySelector('.close').addEventListener('click',()=>article.classList.remove('timeline-open'));
 article.querySelectorAll('button[data-kind]:not([data-kind="background"])').forEach(b=>b.addEventListener('click',()=>article.classList.remove('timeline-open')));
});
}
</script>
